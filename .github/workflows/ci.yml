# Runs on every push and pull request: unit and API tests, a dependency audit,
# and the browser journeys (core tracking, AI consent boundary, CSP).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit and API tests
        run: npm test
      - name: Dependency audit (high and critical fail the build)
        run: npm audit --audit-level=high
      - name: Install Chromium for the browser journeys
        run: npx playwright install --with-deps chromium
      - name: Browser journeys
        run: npm run e2e
